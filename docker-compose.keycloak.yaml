services:
  keycloak-db:
    image: postgres:16
    container_name: musicplayer-keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: musicplayer-keycloak
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
    command:
      - start-dev
    ports:
      - "8081:8080"

  backend:
    depends_on:
      keycloak:
        condition: service_started
    environment:
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/music-player
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: music-player
      KEYCLOAK_CLIENT_ID: music-player-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me-local}

      # Keep these only while your current custom JWT auth still exists.
      JWT_REFRESH_EXPIRATION: 86400000
      JWT_REFRESH_COOKIE_SECURE: "false"
      JWT_REFRESH_COOKIE_SAME_SITE: Strict
      FORWARD_HEADERS_STRATEGY: none

volumes:
  keycloak_postgres_data:
