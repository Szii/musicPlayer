# PROD with multiple pods: replace local JCache/Caffeine backed Bucket4j storage.
spring.cache.type=jcache
spring.cache.jcache.provider=com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
spring.cache.cache-names=buckets,filterConfigCache
# PROD behind ingress/reverse proxy: set FORWARD_HEADERS_STRATEGY=native or framework and configure trusted proxies.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
bucket4j.enabled=true
bucket4j.cache-to-use=jcache
bucket4j.filters[0].id=api-global-ip
bucket4j.filters[0].cache-name=buckets
bucket4j.filters[0].filter-method=servlet
bucket4j.filters[0].url=^/api/v1/.*
bucket4j.filters[0].strategy=all
bucket4j.filters[0].rate-limits[0].cache-key=getRemoteAddr()
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=300
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes
bucket4j.filters[0].rate-limits[0].bandwidths[0].refill-speed=greedy
