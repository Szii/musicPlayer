########### Keycloak / OAuth2 Resource Server ###########
# Realm name
keycloak.realm=${KEYCLOAK_REALM:music-player}
# Public issuer URI. This must match the "iss" claim inside Keycloak access tokens.
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/music-player}
# Keycloak Internal URL
keycloak.internal-url=${KEYCLOAK_INTERNAL_URL:http://localhost:8081}
# In Docker Compose this should resolve to http://keycloak:8080/...
keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${keycloak.internal-url}/realms/${keycloak.realm}/protocol/openid-connect/certs}
# Client used by backend for login/refresh/logout token requests.
keycloak.client-id=${KEYCLOAK_CLIENT_ID:music-player-backend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:change-me-local}
# Admin client
keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:music-player-admin}
keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:change-me-local-admin}
# Keycloak endpoints
keycloak.token-uri=${keycloak.internal-url}/realms/${keycloak.realm}/protocol/openid-connect/token
keycloak.logout-uri=${keycloak.internal-url}/realms/${keycloak.realm}/protocol/openid-connect/logout
keycloak.revoke-uri=${keycloak.internal-url}/realms/${keycloak.realm}/protocol/openid-connect/revoke
keycloak.admin-users-uri=${keycloak.internal-url}/admin/realms/${keycloak.realm}/users
# Keycloak Spring Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.jwk-set-uri}
# Prometheus metrics
########### Actuator / Micrometer (Prometheus) ###########
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,prometheus}
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${MANAGEMENT_APP_TAG:music-player-backend}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

